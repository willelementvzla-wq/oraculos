<style>

/* ---------- RELOJ ---------- */
.reloj{background:#101a33;border-radius:14px;padding:18px 20px;color:#dbe3f2;box-shadow:0 6px 20px rgba(13,27,62,.22)}
.reloj > h2{margin:0 0 14px;font-size:14.5px;letter-spacing:1.3px;color:#8fa8e0;text-transform:uppercase;font-weight:800}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:14px}
.rcard{background:#161f38;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:15px 17px;position:relative}

.pmrow{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

.flag{margin-top:11px;background:rgba(184,32,60,.20);border:1px solid #b3273f;border-radius:7px;padding:7px 11px;

/* ---------- TICKETS ---------- */

.tk.short{border-color:#f0a5b4;background:#fffbfc}
.tk h3{margin:0;font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.tk.long h3{color:#0f7a4d}.tk.short h3{color:#b32741}
.tkprice{font-size:33px;font-weight:800;letter-spacing:-1px;margin:-4px 0 0}
.tk.long .tkprice{color:var(--green)}.tk.short .tkprice{color:var(--red)}
.formula{background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:13px;color:#4a5670}
.subbox{background:#f7f8fc;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.subbox h5{margin:0 0 6px;font-size:13.5px;font-weight:700;color:#31405e;display:flex;gap:7px;align-items:center}

/* ---------- MERCE ---------- */

/* ---------- COLISEO ---------- */

.col.c1{background:#fafaff}.col.c2{background:#f5f9ff;border-color:#d6e6fb}

.c1 .coltag{background:#39424f}.c2 .coltag{background:var(--blue)}.c3 .coltag{background:#e0447f}
.col h3{margin:0 0 12px;font-size:15px;font-weight:700;padding-right:60px}
.box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;text-align:center;margin-bottom:11px}
.box .lab{color:#8a94a8;margin-bottom:4px}
.box .v{font-size:22px;font-weight:800}

.c3 .box .lab{color:#f0a8c4}.c3 .box .v{color:#ff5fa2;font-size:23px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#46536f}
.kv b{font-family:var(--mono)}
.split{display:flex;text-align:center}
.split > div{flex:1}
.split .v{font-size:21px;font-weight:800}
.analisis{background:#f2f3f7;border-radius:8px;padding:11px 12px;font-size:12.6px;color:#4b586f;margin-top:11px}
.c3 .analisis{background:#5d0c2c;color:#ffd7e6;font-style:italic}

/* ---------- CONSEJO SEGURO (NUEVO) ---------- */
.safe{border-left:5px solid var(--green)}
.safe h2{display:flex;align-items:center;gap:9px}
.safe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:14px}
.panel{border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:#fbfdfc}
.panel h4{margin:0 0 10px;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:#0f7a4d;font-weight:800}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.field label{font-size:13px;color:#46536f}
.field input{width:118px;padding:7px 9px;border:1px solid #cfd6e4;border-radius:7px;font-family:var(--mono);font-size:13px;text-align:right}
.out{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-top:1px dashed #dfe4ee}
.out b{font-family:var(--mono);font-size:15px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.2px;color:#46536f;margin-bottom:8px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--green);flex:none}
.tip{background:#eefaf3;border:1px solid #b9e7cf;border-radius:9px;padding:12px 14px;font-size:13.5px;color:#14603f;margin-top:14px}
.tip b{color:#0a4b2f}
.legal{font-size:12px;color:#7c869a;margin-top:12px;line-height:1.55}

/* ---------- ESTADO / MANUAL ---------- */
.status{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#6f7b93}
.pill{background:#e9edf6;border-radius:20px;padding:4px 12px;font-weight:600}
.pill.live{background:#dcfce7;color:#12653f}
.pill.err{background:#fee2e2;color:#9b1c26}
.btn{border:1px solid #cfd6e4;background:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-size:13px;
  font-weight:600;color:#33415c;cursor:pointer}
.btn:hover{background:#f2f5fb}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
#manual{display:none}
#manual.show{display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.mgrid .field{flex-direction:column;align-items:stretch;gap:5px}
.mgrid input{width:100%;text-align:left}
.loading{padding:44px;text-align:center;color:#8a94a8;font-size:14px}
@media (max-width:760px){
  body{padding:11px}
  .tk-grid{grid-template-columns:1fr}
  .htitle h1{font-size:21px}
  .tkprice{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){
  .wrap > *{animation:rise .45s ease both}
  .wrap > *:nth-child(2){animation-delay:.05s}.wrap > *:nth-child(3){animation-delay:.1s}
  .wrap > *:nth-child(4){animation-delay:.15s}.wrap > *:nth-child(5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
}
</style>

<body>
<div class="wrap" id="app">
  <div class="loading" id="boot">Conectando con el mercado…</div>
</div>

<script>
/* ============================================================
   EL ORÁCULO — MOTOR ANALÍTICO
   Config del activo (inyectada por el generador)
   ============================================================ */
const ASSET = {"key": "btc", "name": "Bitcoin", "badge": "BTC", "symbol": "$", "decimals": 2, "step": 100, "unidad": "BTC", "sizeDec": 5, "cuenta": "$", "subtitulo": "Delta Neutral Institucional — BTC/USD · Mercado 24/7", "riesgo": "El bitcoin cotiza sin pausa y puede moverse con violencia de madrugada, cuando no estás mirando la pantalla."};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const dec = ASSET.decimals;
const fmt = (x, d = dec) => (x === null || x === undefined || !isFinite(x)) ? '--'
  : Number(x).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const money = (x, d = dec) => (x === null || !isFinite(x)) ? '--' : ASSET.symbol + fmt(x, d);
const cash  = x => (!isFinite(x)) ? '--' : ASSET.cuenta + fmt(x, 2);
const signed = (x, d = dec) => (x >= 0 ? '+' : '-') + ASSET.symbol + fmt(Math.abs(x), d);
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESC = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm = ts => new Date(ts).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:'UTC'}) + ' UTC';
const avg = a => a.reduce((s,v)=>s+v,0)/a.length;

/* ---------- red: intento directo + proxies CORS ---------- */
const PROXIES = [
  u => u,
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u)
];
async function grab(url, asText) {
  let last;
  for (const p of PROXIES) {
    try {
      const r = await fetch(p(url), {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return asText ? await r.text() : await r.json();
    } catch (e) { last = e; }
  }
  throw last;
}

/* ============================================================
   FUENTES DE DATOS POR ACTIVO
   Devuelven { daily:[{t,o,h,l,c}], intraday:[{t,o,h,l,c}], fuente, extra }
   ============================================================ */
const K = k => ({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4]});

async function srcBinance(sym) {
  const d = await grab(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=1d&limit=70`);
  const i = await grab(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=1h&limit=72`);
  if (!Array.isArray(d) || d.length < 25) throw new Error('serie corta');
  return {daily: d.map(K), intraday: i.map(K), fuente: 'Binance ' + sym};
}
async function srcCoinbase() {
  const c = await grab('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400');
  const h = await grab('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600');
  const m = a => a.map(r => ({t:r[0]*1000, l:+r[1], h:+r[2], o:+r[3], c:+r[4]})).sort((x,y)=>x.t-y.t);
  return {daily: m(c), intraday: m(h), fuente: 'Coinbase BTC-USD'};
}
async function srcYahoo(sym) {
  const enc = encodeURIComponent(sym);
  const d = await grab(`https://query1.finance.yahoo.com/v8/finance/chart/${enc}?interval=1d&range=4mo`);
  const i = await grab(`https://query1.finance.yahoo.com/v8/finance/chart/${enc}?interval=60m&range=5d`);
  const conv = j => {
    const r = j.chart.result[0], q = r.indicators.quote[0], out = [];
    r.timestamp.forEach((t, n) => {
      if (q.open[n] == null || q.close[n] == null) return;
      out.push({t: t*1000, o:+q.open[n], h:+q.high[n], l:+q.low[n], c:+q.close[n]});
    });
    return out;
  };
  const dd = conv(d);
  if (dd.length < 25) throw new Error('serie corta');
  return {daily: dd, intraday: conv(i), fuente: 'Yahoo Finance ' + sym};
}
async function srcStooq(sym) {
  const txt = await grab(`https://stooq.com/q/d/l/?s=${sym}&i=d`, true);
  const rows = txt.trim().split('\n').slice(1).map(r => r.split(','));
  const out = rows.filter(r => r.length >= 5 && r[1] !== 'N/D')
    .map(r => ({t: Date.parse(r[0] + 'T00:00:00Z'), o:+r[1], h:+r[2], l:+r[3], c:+r[4]}))
    .filter(r => isFinite(r.o)).slice(-70);
  if (out.length < 25) throw new Error('serie corta');
  return {daily: out, intraday: [], fuente: 'Stooq ' + sym.toUpperCase()};
}
async function srcFrankfurter() {
  const from = new Date(Date.now() - 130*864e5).toISOString().slice(0,10);
  const j = await grab(`https://api.frankfurter.app/${from}..?from=EUR&to=USD`);
  const out = Object.keys(j.rates).sort().map(k => {
    const v = j.rates[k].USD;
    return {t: Date.parse(k + 'T00:00:00Z'), o:v, h:v, l:v, c:v};
  });
  if (out.length < 25) throw new Error('serie corta');
  return {daily: out, intraday: [], fuente: 'BCE / Frankfurter (cierres oficiales)'};
}

const FUENTES = {
  btc:    [() => srcBinance('BTCUSDT'), () => srcCoinbase(), () => srcYahoo('BTC-USD')],
  eurusd: [() => srcYahoo('EURUSD=X'), () => srcBinance('EURUSDT'), () => srcStooq('eurusd'), () => srcFrankfurter()],
  wti:    [() => srcYahoo('CL=F'), () => srcStooq('cl.f'), () => srcYahoo('USO')]
};

async function cargarDatos() {
  const errs = [];
  for (const f of FUENTES[ASSET.key]) {
    try {
      const r = await f();
      r.daily.sort((a,b)=>a.t-b.t);
      if (r.intraday) r.intraday.sort((a,b)=>a.t-b.t);
      return r;
    } catch (e) { errs.push(e.message); }
  }
  throw new Error('Sin conexión con las fuentes de mercado (' + errs.join(' · ') + ')');
}

/* ============================================================
   INDICADORES
   ============================================================ */
function bollingerTop(closes, n = 20, k = 2) {
  const s = closes.slice(-n); if (s.length < 5) return null;
  const m = avg(s), sd = Math.sqrt(avg(s.map(v => (v-m)**2)));
  return m + k*sd;
}
function atr(velas, n = 14) {
  const s = velas.slice(-(n+1)); if (s.length < 3) return null;
  const tr = [];
  for (let i = 1; i < s.length; i++)
    tr.push(Math.max(s[i].h - s[i].l, Math.abs(s[i].h - s[i-1].c), Math.abs(s[i].l - s[i-1].c)));
  return avg(tr);
}
function ema(a, n) { const k = 2/(n+1); return a.reduce((p,v,i) => i ? v*k + p*(1-k) : v, 0); }

/* ============================================================
   MOTOR DEL ORÁCULO
   idx = índice de la vela diaria que se analiza (la "sesión")
   ============================================================ */
function oraculo(data, idx) {
  const D = data.daily;
  const hoy = D[idx], ayer = D[idx-1];
  const hist = D.slice(0, idx);                        // cerradas antes de la sesión
  const closes = hist.map(v => v.c);

  const open   = hoy.o;
  const techo  = bollingerTop(closes, 20, 2);
  const rango  = ayer.h - ayer.l;
  const atr14  = atr(hist, 14) || rango;

  // Excursiones medias desde la apertura (últimas 10 sesiones cerradas)
  const ult = hist.slice(-10);
  const mayor = avg(ult.map(v => Math.max(v.h - v.o, 0)));
  const menor = avg(ult.map(v => Math.max(v.o - v.l, 0)));
  const buffer = open * 0.0005;                        // colchón institucional 0,05 %

  // --- Tickets MOO Delta Neutral ---
  const tpLong  = open + mayor - buffer;
  const tpShort = open - menor + buffer;

  // --- Súper Quero Centrífuga ---
  const cIntUp = open + atr14,  cExtUp = open + atr14 + mayor;
  const cIntDn = open - atr14,  cExtDn = open - atr14 - mayor;
  const divLong  = tpLong  < cIntUp;
  const divShort = tpShort > cIntDn;

  // --- Tsunami x2 ---
  const tsuInt = open + 2*mayor + atr14;
  const tsuExt = open + 2*mayor + atr14 + mayor;
  const objetivo = Math.ceil(tsuExt / ASSET.step) * ASSET.step;

  // --- Ventana PM (8 h previas a la apertura) ---
  const ini = hoy.t - 8*3600e3;
  const pm = (data.intraday || []).filter(v => v.t >= ini && v.t < hoy.t);
  let pmMax = null, pmMin = null, tMax = null, tMin = null, barrido = false;
  if (pm.length >= 2) {
    pmMax = -Infinity; pmMin = Infinity;
    pm.forEach(v => {
      if (v.h > pmMax) { pmMax = v.h; tMax = v.t; }
      if (v.l < pmMin) { pmMin = v.l; tMin = v.t; }
    });
    barrido = (tMin >= hoy.t - 2*3600e3) && open > pmMin;   // mínimo pegado a la campana
  }
  const dentro = (pmMax !== null) ? (open <= pmMax && open >= pmMin) : (Math.abs(open - ayer.c) <= atr14);

  // --- Radar / Macondo ---
  const f = new Date(hoy.t);
  const dia = f.getUTCDate();
  const tercio = dia <= 10 ? 0 : dia <= 20 ? 1 : 2;
  const gap = open - ayer.c;
  const aperturaPM = pm.length ? pm[0].o : open;
  const macondo = aperturaPM - ayer.c;

  // --- Fase Tsunami: sólo con estructura alcista confirmada ---
  const pivot = (ayer.h + ayer.l + ayer.c) / 3;
  const tendencia = ema(closes.slice(-5), 5) - ema(closes.slice(-20), 20);
  const fase2 = (open > pivot) && (tendencia > 0);

  // --- Coliseo ---
  const e5 = ema(closes.slice(-5), 5), e10 = ema(closes.slice(-10), 10);
  const vector = ((e5 - e10) / e10) * 100;
  const predOpen = ayer.c * (1 + vector/100);
  const acierto = Math.sign(predOpen - ayer.c) === Math.sign(open - ayer.c) && gap !== 0;

  const z = (open - pivot) / atr14;
  let longPct = Math.round(100 / (1 + Math.exp(-z * 1.8)));
  longPct = Math.min(92, Math.max(8, longPct));

  const votos = [
    Math.sign(gap),
    Math.sign(open - pivot),
    Math.sign(tendencia),
    barrido ? 1 : Math.sign(open - ayer.c)
  ];
  const suma = votos.reduce((a,b)=>a+b, 0);
  const dir = suma >= 0 ? 'LARGO' : 'CORTO';
  const acuerdo = votos.filter(v => Math.sign(v) === Math.sign(suma || 1)).length;
  const letal = Math.round(acuerdo / votos.length * 100);
  const dominio = letal >= 100 ? 'TOTAL' : letal >= 75 ? 'ALTO' : 'PARCIAL';

  return {hoy, ayer, open, techo, rango, atr14, mayor, menor, buffer, tpLong, tpShort,
    cIntUp, cExtUp, cIntDn, cExtDn, divLong, divShort, tsuInt, tsuExt, objetivo,
    pmMax, pmMin, tMax, tMin, barrido, dentro, tercio, dia, fecha: f, gap, aperturaPM, macondo,
    pivot, tendencia, fase2, vector, predOpen, acierto, longPct, dir, letal, dominio, pm};
}

    const rr = objetivo / st;
    $('#calc').innerHTML = `
      <div class="out"><span>Tamaño de posición</span><b>${fmt(unidades, ASSET.sizeDec)} ${ASSET.unidad}</b></div>
      <div class="out"><span>Pérdida máxima si salta el stop</span><b style="color:var(--red)">−${cash(perdida)}</b></div>
      <div class="out"><span>Beneficio al objetivo del día</span><b style="color:var(--green)">+${cash(unidades*objetivo)}</b></div>
      <div class="out"><span>Relación beneficio/riesgo</span><b style="color:${rr>=1.5?'var(--green)':'var(--red)'}">${rr.toFixed(2)} : 1</b></div>
      ${rr < 1.5 ? '<p class="warnline" style="margin:9px 0 0">El objetivo no paga el riesgo. Acerca el stop o deja pasar la operación.</p>' : ''}`;
  };
  ['#cap','#rsk','#stp'].forEach(s => { $(s).oninput = calc; });
  calc();

  const consejos = [
    ['Arriesga siempre lo mismo.', 'Un porcentaje fijo y pequeño por operación (1 % o menos) hace que ninguna racha mala te saque del juego. La supervivencia manda sobre el acierto.'],
    ['El stop entra con la orden, no después.', 'Colocarlo al mismo tiempo que la entrada elimina la decisión emocional en el peor momento posible: cuando ya vas perdiendo.'],
    ['Sin objetivo que pague, no hay operación.', 'Si lo que puedes ganar no supera claramente lo que arriesgas, la matemática juega en tu contra aunque aciertes más de la mitad de las veces.'],
    ['Nunca dupliques para recuperar.', 'Aumentar el tamaño después de perder es la forma más rápida y más común de vaciar una cuenta.'],
    ['El apalancamiento multiplica las dos direcciones.', 'Amplifica la ganancia y la pérdida por igual, y en productos apalancados puedes perder más de lo que depositaste.'],
    ['Anota cada operación.', 'Un registro con la razón de entrada, el stop y el resultado enseña más en un mes que cualquier indicador.'],
    ['Un plan escrito antes de abrir el mercado.', 'Decidir en caliente, con el precio moviéndose, es decidir mal. El plan se escribe cuando el mercado está cerrado.'],
    ['Menos operaciones, mejores operaciones.', 'La mayoría de las pérdidas vienen de entradas que no estaban en el plan. Esperar sentado también es operar.']
  ];
  const c = consejos[new Date(o.hoy.t).getUTCDate() % consejos.length];
  $('#tip').innerHTML = `<b>Consejo del día — ${c[0]}</b><br>${c[1]}`;
}

/* ============================================================
   ARRANQUE + AUTO-ACTUALIZACIÓN
   ============================================================ */
async function iniciar(manual) {
  if (!DATA) $('#app').innerHTML = '<div class="loading">Conectando con el mercado…</div>';
  try {
    const d = await cargarDatos();
    const seguirUltimo = (IDX === -1) || (DATA && IDX === DATA.daily.length - 1);
    DATA = d;
    IDX = seguirUltimo ? DATA.daily.length - 1 : Math.min(IDX, DATA.daily.length - 1);
    pintar();
  } catch (e) {
    if (DATA) { const s = $('#stamp'); if (s) s.textContent = 'sin respuesta · ' + new Date().toLocaleTimeString('es-CL'); return; }
    $('#app').innerHTML = `<div class="card"><h2>El mercado no responde</h2>
      <p class="dim" style="margin-top:8px">${esc(e.message)}</p>
      <p class="dim">Suele pasar por bloqueo de red del navegador o porque la fuente está caída.
      Prueba a recargar; si sigue igual, introduce los cuatro precios y el oráculo funciona igual.</p>
      <div class="mgrid">
        <div class="field"><label>Cierre anterior</label><input id="m_pc" class="mono" type="number" step="any"></div>
        <div class="field"><label>Máximo anterior</label><input id="m_ph" class="mono" type="number" step="any"></div>
        <div class="field"><label>Mínimo anterior</label><input id="m_pl" class="mono" type="number" step="any"></div>
        <div class="field"><label>Apertura de hoy</label><input id="m_o" class="mono" type="number" step="any"></div>
      </div>
      <button class="btn p" id="bootManual">Calcular con estos precios</button>
      <button class="btn" id="bootRetry">Reintentar conexión</button></div>`;
    $('#bootRetry').onclick = () => iniciar(true);
    $('#bootManual').onclick = () => {
      const g = id => parseFloat($(id).value);
      const pc = g('#m_pc'), ph = g('#m_ph'), pl = g('#m_pl'), op = g('#m_o');
      if (![pc,ph,pl,op].every(isFinite)) return alert('Faltan precios. Completa los cuatro campos.');
      const base = [];
      for (let i = 24; i > 0; i--) base.push({t: Date.now() - i*864e5, o: pc, h: pc, l: pc, c: pc});
      base[base.length-1] = {t: Date.now() - 864e5, o: pc, h: ph, l: pl, c: pc};
      base.push({t: Date.now(), o: op, h: op, l: op, c: op});
      DATA = {daily: base, intraday: [], fuente: 'Entrada manual', error: true};
      IDX = base.length - 1; pintar();
    };
  }
}
iniciar();
setInterval(() => iniciar(), 60000);           // se refresca solo cada minuto
document.addEventListener('visibilitychange', () => { if (!document.hidden) iniciar(); });
</script>
